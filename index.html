<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AP Physics 1 Mock Exam</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: graph-paper lab notebook — question column + navigator rail; force-vector red marks every action, velocity blue marks secondary tools */
:root{
  --paper:#eef2f6; --surface:#ffffff; --surface-2:#f5f7fb; --ink:#14203a; --muted:#566480; --rule:#d4dbe6;
  --grid:rgba(31,74,140,.07); --grid-major:rgba(31,74,140,.13);
  --force:#d33a20; --force-ink:#ffffff; --force-soft:rgba(211,58,32,.10);
  --vel:#1f5fd1; --vel-soft:rgba(31,95,209,.10);
  --good:#147a4e; --good-soft:rgba(20,122,78,.12); --bad:#b3261e; --bad-soft:rgba(179,38,30,.09); --warn:#9a6200; --warn-soft:rgba(168,106,0,.13);
  --shadow:0 1px 2px rgba(20,32,58,.06),0 10px 28px rgba(20,32,58,.07);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0b111b; --surface:#131b29; --surface-2:#192233; --ink:#e6ebf3; --muted:#97a4bb; --rule:#28344a;
  --grid:rgba(120,160,230,.055); --grid-major:rgba(120,160,230,.11);
  --force:#ff6b4f; --force-ink:#1c0b06; --force-soft:rgba(255,107,79,.14);
  --vel:#7ea8ff; --vel-soft:rgba(126,168,255,.14);
  --good:#3fcf8f; --good-soft:rgba(63,207,143,.14); --bad:#ff7d72; --bad-soft:rgba(255,125,114,.13); --warn:#f2b64c; --warn-soft:rgba(242,182,76,.14);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.28); color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0b111b; --surface:#131b29; --surface-2:#192233; --ink:#e6ebf3; --muted:#97a4bb; --rule:#28344a;
  --grid:rgba(120,160,230,.055); --grid-major:rgba(120,160,230,.11);
  --force:#ff6b4f; --force-ink:#1c0b06; --force-soft:rgba(255,107,79,.14);
  --vel:#7ea8ff; --vel-soft:rgba(126,168,255,.14);
  --good:#3fcf8f; --good-soft:rgba(63,207,143,.14); --bad:#ff7d72; --bad-soft:rgba(255,125,114,.13); --warn:#f2b64c; --warn-soft:rgba(242,182,76,.14);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.28); color-scheme:dark;}

*{box-sizing:border-box}
body{background-color:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  background-image:linear-gradient(var(--grid-major) 1px,transparent 1px),linear-gradient(90deg,var(--grid-major) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2.5px solid var(--vel);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
sub,sup{font-size:.72em;line-height:0}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:.5em;border:1.5px solid var(--rule);background:var(--surface);border-radius:10px;padding:.55em 1em;font-weight:700;transition:transform .12s,border-color .12s,background .12s}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--force);border-color:var(--force);color:var(--force-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.blue{background:var(--vel-soft);border-color:transparent;color:var(--vel)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:1.05em;height:1.05em;flex:none}

/* topbar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.topbar .wrap{display:flex;align-items:center;gap:12px;min-height:58px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand-mark{width:30px;height:30px;flex:none}
.brand b{font-family:var(--display);font-size:1.08rem;letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--muted);font-size:.85rem;white-space:nowrap}
.clock{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:1.02rem;padding:.35em .7em;border-radius:8px;background:var(--surface-2);border:1px solid var(--rule);display:inline-flex;align-items:center;gap:.45em}
.clock.low{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.clock .dot{width:7px;height:7px;border-radius:50%;background:var(--force);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.tools{display:flex;gap:4px;flex-wrap:wrap}
.modepill{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;padding:.3em .6em;border-radius:6px;background:var(--vel-soft);color:var(--vel);font-weight:600}
.modepill.exam{background:var(--force-soft);color:var(--force)}

main{padding-block:24px 80px}

/* START */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:20px 8px}
.hero h1{font-size:clamp(2.3rem,5.4vw,4.1rem);line-height:.98;font-weight:800}
.hero h1 em{font-style:normal;color:var(--force)}
.hero p{max-width:56ch;color:var(--muted);font-size:1.06rem;margin:16px 0 0}
.scope{background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.scope canvas{display:block;width:100%;height:190px}
.scope .cap{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--rule);font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.specs{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:22px}
.spec b{display:block;font-family:var(--display);font-size:1.6rem;line-height:1}
.spec span{font-size:.82rem;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:34px}
.mode{text-align:left;background:var(--surface);border:2px solid var(--rule);border-radius:16px;padding:20px;display:grid;gap:8px;align-content:start;transition:border-color .15s,box-shadow .15s}
.mode:hover{border-color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--force);box-shadow:0 0 0 4px var(--force-soft)}
.mode.prac[aria-pressed="true"]{border-color:var(--vel);box-shadow:0 0 0 4px var(--vel-soft)}
.mode h3{font-size:1.3rem;display:flex;align-items:center;gap:10px}
.mode p{margin:0;color:var(--muted);font-size:.95rem}
.mode ul{margin:4px 0 0;padding-left:1.1em;font-size:.9rem;display:grid;gap:2px}
.setup{margin-top:18px;background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:18px 20px;display:grid;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--rule);background:var(--surface-2);border-radius:999px;padding:.32em .8em;font-size:.86rem;display:inline-flex;gap:.4em;align-items:center}
.chip .n{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--vel);background:var(--vel-soft);color:var(--vel)}
.chip[aria-pressed="true"] .n{color:inherit}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.go{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:22px}
.go .btn.primary{font-size:1.08rem;padding:.75em 1.4em}
.note{font-size:.85rem;color:var(--muted)}
.toggle{display:inline-flex;align-items:center;gap:.55em;cursor:pointer;font-size:.92rem}
.toggle input{width:18px;height:18px;accent-color:var(--vel)}
.blueprint{margin-top:34px}
.blueprint h2{font-size:1.25rem;margin-bottom:12px}
.bp-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.bp{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.bp .eyebrow{font-size:.66rem}
.bp b{font-family:var(--display);font-size:.98rem;line-height:1.2}

/* EXAM LAYOUT */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 272px;gap:22px;align-items:start}
.qcard{background:var(--surface);border:1px solid var(--rule);border-radius:18px;box-shadow:var(--shadow);padding:22px 26px 20px;min-width:0}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.qnum{font-family:var(--display);font-weight:800;font-size:1.35rem}
.qnum small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:.85rem}
.utag{font-family:var(--mono);font-size:.72rem;letter-spacing:.04em;padding:.28em .6em;border-radius:6px;background:var(--surface-2);border:1px solid var(--rule);color:var(--muted)}
.flagbtn{margin-left:auto}
.flagbtn[aria-pressed="true"]{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.stem{font-size:1.06rem;max-width:68ch}
.stem p{margin:0 0 .6em}
.fig{margin:14px 0 4px;max-width:420px;overflow-x:auto}
.fig svg{display:block;width:100%;height:auto}
.fig .ax{stroke:var(--ink);stroke-width:1.5;fill:none}
.fig .gd{stroke:var(--rule);stroke-width:1;fill:none}
.fig .ln{stroke:var(--vel);stroke-width:2.5;fill:none}
.fig .fv{stroke:var(--force);stroke-width:2.5;fill:none}
.fig .fvh{fill:var(--force);stroke:none}
.fig .vvh{fill:var(--vel);stroke:none}
.fig .blk{fill:var(--surface-2);stroke:var(--ink);stroke-width:1.5}
.fig .wtr{fill:var(--vel-soft);stroke:var(--vel);stroke-width:1.5}
.fig text{fill:var(--ink);font-family:var(--mono);font-size:11px}
.fig .mt{fill:var(--muted)}
.choices{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:10px}
.choices li{display:flex;gap:8px;align-items:stretch}
.choice{flex:1;min-width:0;display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border:1.5px solid var(--rule);border-radius:12px;padding:12px 14px;transition:border-color .12s,background .12s,transform .12s}
.choice:hover:not([disabled]){border-color:var(--ink)}
.choice .letter{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:.88rem;border:1.5px solid var(--rule);background:var(--surface-2)}
.choice .ctext{min-width:0}
.choice[aria-pressed="true"]{border-color:var(--force);background:var(--force-soft)}
.choice[aria-pressed="true"] .letter{background:var(--force);border-color:var(--force);color:var(--force-ink)}
.choice.struck .ctext{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.choice.struck .letter{opacity:.45}
.choice.is-correct{border-color:var(--good);background:var(--good-soft)}
.choice.is-correct .letter{background:var(--good);border-color:var(--good);color:var(--surface)}
.choice.is-wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.is-wrong .letter{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.choice[disabled]{cursor:default}
.verdict{margin-left:auto;font-family:var(--mono);font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.is-correct .verdict{color:var(--good)} .is-wrong .verdict{color:var(--bad)}
.strike{flex:none;width:42px;border:1.5px dashed var(--rule);background:transparent;border-radius:12px;color:var(--muted);display:grid;place-items:center}
.strike:hover{border-color:var(--muted);color:var(--ink)}
.strike[aria-pressed="true"]{border-style:solid;color:var(--ink);background:var(--surface-2)}
.strike svg{width:18px;height:18px}
.qactions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.feedback{margin-top:18px;border-radius:12px;padding:14px 16px;border:1px solid var(--rule);background:var(--surface-2);max-width:72ch;animation:rise .35s ease}
.feedback.good{border-color:var(--good);background:var(--good-soft)}
.feedback.bad{border-color:var(--bad);background:var(--bad-soft)}
.feedback strong{font-family:var(--display);font-size:1.05rem;display:block;margin-bottom:4px}
.feedback.good strong{color:var(--good)} .feedback.bad strong{color:var(--bad)}
.feedback p{margin:.3em 0}
@keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.qfoot{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:16px;border-top:1px dashed var(--rule)}
.hint{font-size:.8rem;color:var(--muted)}
.hint kbd{font-family:var(--mono);font-size:.72rem;border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 .35em;background:var(--surface-2)}

/* lab bench */
.bench{margin-top:20px;border:1.5px solid var(--vel);border-radius:14px;overflow:hidden;background:var(--surface)}
.bench-h{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--vel-soft);color:var(--vel);flex-wrap:wrap}
.bench-h b{font-family:var(--display)}
.bench-h span{font-size:.85rem;color:var(--ink);opacity:.8}
.bench canvas{display:block;width:100%;touch-action:none}
.ctrls{display:flex;flex-wrap:wrap;gap:12px 22px;padding:12px 14px;border-top:1px solid var(--rule);align-items:center}
.ctrl{display:grid;gap:2px;font-size:.82rem;min-width:150px;flex:1}
.ctrl label{display:flex;justify-content:space-between;gap:8px;color:var(--muted)}
.ctrl label output{font-family:var(--mono);color:var(--ink);font-weight:600}
.ctrl input[type=range]{width:100%;accent-color:var(--vel)}
.readouts{display:flex;flex-wrap:wrap;gap:8px 18px;padding:0 14px 12px;font-family:var(--mono);font-size:.8rem}
.readouts span b{color:var(--vel)}
.locked{margin-top:20px;border:1.5px dashed var(--rule);border-radius:14px;padding:12px 14px;color:var(--muted);font-size:.88rem;display:flex;gap:10px;align-items:center}
.locked svg{width:18px;height:18px;flex:none}

/* nav rail */
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:grid;gap:14px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px}
.panel h3{font-size:.98rem;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
.panel h3 span{font-family:var(--mono);font-size:.74rem;color:var(--muted);font-weight:400}
.navgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.nc{position:relative;aspect-ratio:1;max-width:100%;border:1.5px solid var(--rule);background:var(--surface-2);border-radius:8px;font-family:var(--mono);font-size:.78rem;font-weight:600;display:grid;place-items:center;padding:0}
.nc.ans{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.nc.ok{background:var(--good);border-color:var(--good);color:var(--surface)}
.nc.no{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.nc.cur{outline:2.5px solid var(--force);outline-offset:2px}
.nc.flag::after{content:"";position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--warn);border:2px solid var(--surface)}
.nc.frq{grid-column:span 3;aspect-ratio:auto;padding:.45em 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;font-size:.74rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1.5px solid var(--rule);background:var(--surface-2)}
.legend i.a{background:var(--ink);border-color:var(--ink)} .legend i.f{background:var(--warn);border-color:var(--warn);border-radius:50%}
.progress{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--rule)}
.progress i{display:block;height:100%;background:var(--force);transition:width .3s}
.rail .btn{width:100%;justify-content:center}

/* FRQ */
.frq-part{margin-top:20px;padding-top:18px;border-top:1px dashed var(--rule)}
.frq-part h4{margin:0 0 6px;font-family:var(--display);font-size:1.02rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.frq-part h4 .pts{font-family:var(--mono);font-size:.72rem;color:var(--muted);font-weight:400}
.frq-part p{margin:.2em 0 .6em;max-width:68ch}
textarea{width:100%;min-height:120px;resize:vertical;border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--surface-2);color:var(--ink);font:inherit;font-size:.96rem;line-height:1.5}
select,input[type=text],input[type=number]{border:1.5px solid var(--rule);border-radius:8px;padding:.45em .6em;background:var(--surface-2);color:var(--ink);font:inherit}
.data-table{border-collapse:collapse;font-family:var(--mono);font-size:.85rem;font-variant-numeric:tabular-nums;margin:6px 0}
.data-table th,.data-table td{border:1px solid var(--rule);padding:.3em .8em;text-align:right}
.data-table th{background:var(--surface-2);font-weight:600}
.tablewrap{overflow-x:auto}
.rubric{margin-top:10px;border-radius:10px;border:1px solid var(--rule);background:var(--surface-2);padding:10px 12px;display:grid;gap:6px;font-size:.92rem}
.rubric .rh{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rubric label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.rubric input{margin-top:.25em;width:17px;height:17px;flex:none;accent-color:var(--good)}
.rubric .pp{font-family:var(--mono);font-size:.74rem;color:var(--muted);flex:none;margin-top:.15em}
.autoscore{margin-top:8px;font-family:var(--mono);font-size:.8rem;padding:.4em .7em;border-radius:8px;display:inline-block}
.autoscore.good{background:var(--good-soft);color:var(--good)} .autoscore.bad{background:var(--bad-soft);color:var(--bad)} .autoscore.mid{background:var(--warn-soft);color:var(--warn)}
.graphbox{border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--surface);margin-top:8px}
.graphbox canvas{display:block;width:100%;height:300px;touch-action:none;cursor:grab}
.graphbox .ro{display:flex;gap:8px 18px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--rule);font-family:var(--mono);font-size:.82rem;align-items:center}
.graphbox .ro b{color:var(--force)}

/* energy bars */
.bars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:8px}
.barchart{border:1px solid var(--rule);border-radius:12px;padding:10px;background:var(--surface);min-width:0}
.barchart.ok{border-color:var(--good);box-shadow:0 0 0 3px var(--good-soft)} .barchart.no{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.barchart h5{margin:0 0 8px;font-family:var(--display);font-size:.88rem;display:flex;justify-content:space-between;gap:6px}
.barchart h5 span{font-family:var(--mono);font-weight:400;color:var(--muted);font-size:.7rem}
.bcols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:2px}
.bcol{display:flex;flex-direction:column-reverse;gap:3px}
.bcell{height:26px;border:1.5px dashed var(--rule);border-radius:4px;background:transparent;padding:0}
.bcell:hover{border-color:var(--muted)}
.bcell.on{background:var(--force);border:1.5px solid var(--force)}
.bcell.ghost{box-shadow:inset 0 0 0 2px var(--good)}
.blabels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:4px;text-align:center;font-family:var(--mono);font-size:.7rem;color:var(--muted)}

/* results */
.res-hero{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:18px;display:grid;gap:4px;align-content:start}
.tile .big{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1}
.tile .big small{font-size:1rem;color:var(--muted);font-weight:500}
.tile.ap{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tile.ap .eyebrow{color:inherit;opacity:.7}
.tile.ap .big{font-size:4.6rem}
.tile.ap .note{color:inherit;opacity:.75}
.sec{margin-top:26px}
.sec h2{font-size:1.3rem;margin-bottom:12px}
.ubars{display:grid;gap:10px}
.ubar{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr) 3.5rem;gap:12px;align-items:center;font-size:.9rem}
.ubar .track{height:14px;border-radius:99px;background:var(--surface-2);border:1px solid var(--rule);overflow:hidden}
.ubar .track i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.ubar .v{font-family:var(--mono);font-size:.82rem;text-align:right}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.rlist{display:grid;gap:8px}
.ritem{display:grid;grid-template-columns:2.6rem minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:10px 12px}
.ritem .st{width:2.2rem;height:2.2rem;border-radius:8px;display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:.85rem}
.ritem .st.ok{background:var(--good-soft);color:var(--good)} .ritem .st.no{background:var(--bad-soft);color:var(--bad)} .ritem .st.sk{background:var(--surface-2);color:var(--muted)}
.ritem .t{min-width:0}
.ritem .t b{display:block;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem .t span{font-size:.8rem;color:var(--muted)}
.frqscore{display:grid;gap:14px}
.frqscore .fs{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:14px 16px}
.yours{white-space:pre-wrap;font-size:.92rem;border-left:3px solid var(--rule);padding:.3em .8em;margin:6px 0;color:var(--ink);max-height:180px;overflow:auto}
.yours.empty{color:var(--muted);font-style:italic}

/* drawers + modal */
.scrim{position:fixed;inset:0;background:rgba(10,16,28,.45);z-index:40;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:41;border-left:1px solid var(--rule);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);animation:slide .25s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.drawer-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--rule)}
.drawer-h h2{font-size:1.15rem;margin-right:auto}
.drawer-b{overflow:auto;padding:12px 18px 30px}
.eqs h3{font-size:.8rem;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--force);margin:18px 0 6px}
.eqs table{width:100%;border-collapse:collapse;font-size:.92rem}
.eqs td{padding:.32em 0;border-bottom:1px solid var(--rule);vertical-align:top}
.eqs td:first-child{font-family:var(--mono);font-size:.86rem;white-space:nowrap;padding-right:12px}
.eqs td:last-child{color:var(--muted);font-size:.84rem}
.calc{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:300px;max-width:calc(100% - 32px);z-index:39;background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:0 20px 50px rgba(10,16,28,.25);overflow:hidden;animation:rise .25s}
.calc-h{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;border-bottom:1px solid var(--rule);font-family:var(--display);font-weight:700}
.calc-h .sp{margin-right:auto}
.calc-screen{padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--rule)}
.calc-screen input{width:100%;border:none;background:transparent;font-family:var(--mono);font-size:1rem;padding:0;color:var(--ink)}
.calc-screen input:focus-visible{outline:none}
.calc-out{font-family:var(--mono);font-size:1.5rem;font-weight:600;text-align:right;min-height:1.6em;overflow-x:auto;white-space:nowrap}
.calc-out.err{font-size:.86rem;color:var(--bad);font-weight:400}
.calc-keys{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;padding:10px}
.ck{border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:.5em 0;font-family:var(--mono);font-size:.82rem}
.ck:hover{background:var(--surface-2)}
.ck.op{color:var(--vel)} .ck.eq{background:var(--force);border-color:var(--force);color:var(--force-ink);font-weight:600}
.ck.fn{font-size:.72rem}
.hist{max-height:84px;overflow:auto;padding:0 14px 10px;font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.hist div{cursor:pointer;padding:1px 0} .hist div:hover{color:var(--ink)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:41;width:min(460px,calc(100% - 32px));background:var(--surface);border-radius:18px;border:1px solid var(--rule);padding:22px;box-shadow:0 30px 70px rgba(10,16,28,.3);animation:rise .25s}
.modal h2{font-size:1.35rem;margin-bottom:8px}
.modal p{margin:.4em 0;color:var(--muted)}
.modal .row{margin-top:18px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:.6em 1.1em;border-radius:10px;z-index:60;font-size:.92rem;animation:rise .25s;max-width:calc(100% - 32px)}

@media (max-width:920px){
  .exam{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;order:-1}
  .rail .panel.navp{padding:12px}
  .navgrid{grid-template-columns:repeat(9,minmax(0,1fr))}
  .nc.frq{grid-column:span 3}
  .hero{grid-template-columns:minmax(0,1fr)}
  .res-hero{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bp-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:600px){
  .modes{grid-template-columns:minmax(0,1fr)}
  .qcard{padding:16px 16px 14px;border-radius:14px}
  .navgrid{grid-template-columns:repeat(6,minmax(0,1fr))}
  .bars{grid-template-columns:minmax(0,1fr)}
  .ubar{grid-template-columns:minmax(0,1fr) 3rem}
  .ubar .track{grid-column:1/-1;grid-row:2}
  .brand span{display:none}
  .tools .lbl{display:none}
  .calc{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;max-width:none}
  .strike{width:38px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(function(){
"use strict";
/* ---------- data ---------- */
const UNITS=["Kinematics","Force & Translational Dynamics","Work, Energy & Power","Linear Momentum","Torque & Rotational Dynamics","Energy & Momentum of Rotating Systems","Oscillations","Fluids"];

const arrowHead=(x,y,ang,cls)=>{const s=8,a1=ang+2.6,a2=ang-2.6;return `<path class="${cls}" d="M${x},${y} L${x+s*Math.cos(a1)},${y+s*Math.sin(a1)} L${x+s*Math.cos(a2)},${y+s*Math.sin(a2)} Z"/>`};

const FIG={
vt:`<svg viewBox="0 0 330 210" role="img" aria-label="Velocity versus time graph: a straight line from 6 meters per second at t equals 0 down to negative 2 meters per second at t equals 4 seconds">
<g class="gd">${[1,2,3,4].map(i=>`<line x1="${40+i*60}" y1="20" x2="${40+i*60}" y2="170"/>`).join("")}${[-2,2,4,6].map(v=>`<line x1="40" y1="${120-v*15}" x2="290" y2="${120-v*15}"/>`).join("")}</g>
<line class="ax" x1="40" y1="15" x2="40" y2="175"/><line class="ax" x1="40" y1="120" x2="300" y2="120"/>
<line class="ln" x1="40" y1="30" x2="280" y2="150"/>
${[1,2,3,4].map(i=>`<text x="${40+i*60}" y="136" text-anchor="middle" class="mt">${i}</text>`).join("")}
${[-2,2,4,6].map(v=>`<text x="32" y="${124-v*15}" text-anchor="end" class="mt">${v}</text>`).join("")}
<text x="306" y="124">t (s)</text><text x="46" y="14">v (m/s)</text></svg>`,
blocks:`<svg viewBox="0 0 330 120" role="img" aria-label="A 20 newton force pushes a 2 kilogram block, which is in contact with a 3 kilogram block">
<line class="ax" x1="10" y1="96" x2="320" y2="96"/>
<rect class="blk" x="120" y="50" width="60" height="46" rx="3"/><rect class="blk" x="180" y="36" width="80" height="60" rx="3"/>
<text x="150" y="78" text-anchor="middle">2.0 kg</text><text x="220" y="70" text-anchor="middle">3.0 kg</text>
<line class="fv" x1="40" y1="73" x2="110" y2="73"/>${arrowHead(118,73,0,"fvh")}<text x="72" y="64" text-anchor="middle">F = 20 N</text>
${Array.from({length:16},(_,i)=>`<line class="gd" x1="${14+i*20}" y1="96" x2="${4+i*20}" y2="106"/>`).join("")}</svg>`,
ft:`<svg viewBox="0 0 330 200" role="img" aria-label="Force versus time graph: a triangle rising from 0 to 400 newtons at 0.025 seconds and back to 0 at 0.05 seconds">
<g class="gd">${[100,200,300,400].map(f=>`<line x1="50" y1="${160-f*0.32}" x2="300" y2="${160-f*0.32}"/>`).join("")}</g>
<line class="ax" x1="50" y1="15" x2="50" y2="165"/><line class="ax" x1="50" y1="160" x2="310" y2="160"/>
<path class="ln" d="M50,160 L150,32 L250,160"/>
${[100,200,300,400].map(f=>`<text x="44" y="${164-f*0.32}" text-anchor="end" class="mt">${f}</text>`).join("")}
${[["0.025",150],["0.050",250]].map(([l,x])=>`<text x="${x}" y="176" text-anchor="middle" class="mt">${l}</text>`).join("")}
<text x="56" y="12">F (N)</text><text x="300" y="194" text-anchor="end">t (s)</text></svg>`,
seesaw:`<svg viewBox="0 0 330 140" role="img" aria-label="Seesaw with a 30 kilogram child 2.0 meters left of the pivot and a 40 kilogram child at an unknown distance to the right">
<path class="blk" d="M165,82 L148,116 L182,116 Z"/><line class="ax" x1="20" y1="120" x2="310" y2="120"/>
<rect class="blk" x="25" y="76" width="280" height="7" rx="2"/>
<rect class="blk" x="50" y="44" width="34" height="32" rx="4"/><text x="67" y="64" text-anchor="middle">30</text>
<rect class="blk" x="226" y="40" width="38" height="36" rx="4"/><text x="245" y="62" text-anchor="middle">40</text>
<line class="gd" x1="67" y1="96" x2="165" y2="96"/><text x="116" y="108" text-anchor="middle" class="mt">2.0 m</text>
<line class="gd" x1="165" y1="96" x2="245" y2="96"/><text x="205" y="108" text-anchor="middle" class="mt">x = ?</text>
<text x="67" y="36" text-anchor="middle" class="mt">kg</text><text x="245" y="32" text-anchor="middle" class="mt">kg</text></svg>`,
pipe:`<svg viewBox="0 0 330 130" role="img" aria-label="Horizontal pipe narrowing from area A to area A over 3; water enters at 2 meters per second">
<path class="wtr" d="M10,25 L140,25 L190,50 L320,50 L320,80 L190,80 L140,105 L10,105 Z"/>
<line class="ln" x1="40" y1="65" x2="100" y2="65"/>${arrowHead(108,65,0,"vvh")}<text x="70" y="56" text-anchor="middle">2.0 m/s</text>
<text x="70" y="94" text-anchor="middle" class="mt">area A</text><text x="255" y="70" text-anchor="middle">A/3</text><text x="255" y="40" text-anchor="middle" class="mt">v = ?, P = ?</text></svg>`,
ramp:`<svg viewBox="0 0 340 150" role="img" aria-label="Block of mass m at height h on a curved frictionless ramp; a block of mass 2m rests at the bottom; a spring of constant k is attached to a wall on the right">
<path class="ax" d="M15,20 Q60,120 120,124 L300,124"/><line class="ax" x1="318" y1="70" x2="318" y2="130"/>
<rect class="blk" x="14" y="2" width="22" height="18" rx="2"/><text x="25" y="15" text-anchor="middle">m</text>
<rect class="blk" x="150" y="100" width="34" height="24" rx="2"/><text x="167" y="116" text-anchor="middle">2m</text>
<path class="ln" d="M250,112 l6,-8 l8,16 l8,-16 l8,16 l8,-16 l8,16 l8,-16 l6,8" style="stroke:var(--muted);stroke-width:1.6"/><line class="ax" x1="236" y1="100" x2="236" y2="124" style="stroke-width:2.5"/><line class="ax" x1="236" y1="112" x2="250" y2="112"/>
<text x="296" y="96" class="mt">k</text>
<line class="gd" x1="4" y1="20" x2="4" y2="124"/><text x="8" y="80" class="mt">h</text>
<text x="20" y="140" class="mt">A: release</text><text x="148" y="140" class="mt">B: collision</text><text x="236" y="140" class="mt">C: max squeeze</text></svg>`
};

const MCQ=[
{id:"q1",u:1,stem:"<p>A ball is thrown horizontally at 12 m/s from the top of a cliff 45 m high. How far from the base of the cliff does it land? (Ignore air resistance.)</p>",ch:["18 m","36 m","54 m","72 m"],a:1,exp:"<p>Vertical motion sets the time: 45 = ½(10)t², so t = 3.0 s. Horizontal velocity stays 12 m/s, so x = 12 × 3.0 = <b>36 m</b>.</p>",sim:"projectile"},
{id:"q2",u:1,stem:"<p>The graph shows velocity versus time for a cart moving along a straight track. What is the cart's displacement from t = 0 to t = 4 s?</p>",fig:"vt",ch:["8 m","10 m","12 m","16 m"],a:0,exp:"<p>Displacement is the signed area under a v–t graph. The triangle above the axis (0–3 s) is ½·3·6 = 9 m; the triangle below (3–4 s) is −½·1·2 = −1 m. Net: <b>8 m</b>. (10 m is the total distance.)</p>"},
{id:"q3",u:1,stem:"<p>A ball is thrown straight up. At the highest point of its flight (ignore air resistance):</p>",ch:["its velocity and acceleration are both zero","its velocity is zero and its acceleration is 10 m/s² downward","its velocity is upward and its acceleration is zero","its velocity is zero and its acceleration is reversing direction"],a:1,exp:"<p>Gravity never switches off. The velocity passes through zero at the top, but the acceleration is <b>g downward</b> the whole flight. If acceleration were zero at the top, the ball would hang there.</p>"},
{id:"q4",u:2,stem:"<p>Blocks of 2.0 kg and 3.0 kg sit in contact on a frictionless floor. A 20 N horizontal force pushes the 2.0 kg block as shown. What force does the 2.0 kg block exert on the 3.0 kg block?</p>",fig:"blocks",ch:["4 N","8 N","12 N","20 N"],a:2,exp:"<p>Treat both blocks as one system: a = 20/5 = 4 m/s². The only horizontal force on the 3.0 kg block is the contact force, so F = 3.0 × 4 = <b>12 N</b>.</p>"},
{id:"q5",u:2,stem:"<p>A 60 kg student stands on a bathroom scale in an elevator moving <i>downward</i> and <i>speeding up</i> at 2.0 m/s². What does the scale read?</p>",ch:["120 N","480 N","600 N","720 N"],a:1,exp:"<p>Moving down and speeding up means the acceleration points down. Take down as positive: mg − N = ma, so N = m(g − a) = 60(10 − 2) = <b>480 N</b>.</p>"},
{id:"q6",u:2,stem:"<p>A block of mass m rests motionless on a rough incline of angle θ. The coefficient of static friction is μ<sub>s</sub>. What is the magnitude of the friction force on the block?</p>",ch:["μ<sub>s</sub>mg cos θ","mg sin θ","mg cos θ","μ<sub>s</sub>mg sin θ"],a:1,exp:"<p>The block is in equilibrium, so friction balances the component of gravity along the slope: f = <b>mg sin θ</b>. μ<sub>s</sub>mg cos θ is only the <i>maximum</i> static friction, reached just before slipping.</p>",sim:"incline"},
{id:"q7",u:3,stem:"<p>A 2.0 kg block is released from rest at the top of a frictionless curved track, 5.0 m above the bottom. What is its speed at the bottom?</p>",ch:["5.0 m/s","7.1 m/s","10 m/s","100 m/s"],a:2,exp:"<p>mgh = ½mv², so v = √(2gh) = √(2·10·5) = <b>10 m/s</b>. The mass cancels and the track's shape doesn't matter.</p>"},
{id:"q8",u:3,stem:"<p>A spring (k = 200 N/m) is compressed 0.10 m and launches a 0.50 kg block across a frictionless floor. What is the block's launch speed?</p>",ch:["1.0 m/s","2.0 m/s","4.0 m/s","20 m/s"],a:1,exp:"<p>½kx² = ½(200)(0.10)² = 1.0 J. Then 1.0 = ½(0.50)v², so v² = 4 and v = <b>2.0 m/s</b>.</p>"},
{id:"q9",u:3,stem:"<p>A motor lifts a 50 kg crate straight up at a constant 2.0 m/s. What is the motor's power output?</p>",ch:["100 W","500 W","1000 W","2000 W"],a:2,exp:"<p>Constant speed means the motor's force equals the weight, 500 N. P = Fv = 500 × 2.0 = <b>1000 W</b>.</p>"},
{id:"q10",u:4,stem:"<p>A 2.0 kg cart moving at 3.0 m/s collides with and sticks to a 1.0 kg cart at rest on a level, frictionless track. How much kinetic energy is converted to other forms?</p>",ch:["0 J","3.0 J","6.0 J","9.0 J"],a:1,exp:"<p>Momentum: 2(3) = 3v, so v = 2.0 m/s. KE before = ½·2·9 = 9 J; after = ½·3·4 = 6 J. Lost: <b>3.0 J</b>. Momentum is conserved in every collision; kinetic energy is not in a perfectly inelastic one.</p>"},
{id:"q11",u:4,stem:"<p>The graph shows the net force on a 0.20 kg ball during a kick. What impulse does the ball receive?</p>",fig:"ft",ch:["5.0 N·s","10 N·s","20 N·s","40 N·s"],a:1,exp:"<p>Impulse is the area under the F–t graph: ½ × 0.050 s × 400 N = <b>10 N·s</b>. A ball starting at rest would leave at 10/0.20 = 50 m/s.</p>"},
{id:"q12",u:4,stem:"<p>An egg dropped onto a pillow survives. The same egg dropped from the same height onto a tile floor breaks. Compared with the floor, the pillow:</p>",ch:["reduces the egg's change in momentum","delivers the same impulse over a longer time, so a smaller average force","delivers a larger impulse over a longer time","reduces the egg's speed just before impact"],a:1,exp:"<p>The egg goes from the same speed to rest either way, so Δp (the impulse) is the same. The pillow stretches the stopping time, and F<sub>avg</sub> = Δp/Δt gets <b>smaller</b>.</p>"},
{id:"q13",u:5,stem:"<p>A 30 kg child sits 2.0 m from the pivot of a seesaw. Where must a 40 kg child sit on the other side to balance it? (Ignore the plank's mass.)</p>",fig:"seesaw",ch:["1.0 m","1.5 m","2.0 m","2.7 m"],a:1,exp:"<p>Balanced torques: 30g × 2.0 = 40g × x, so x = <b>1.5 m</b>. The heavier child sits closer.</p>"},
{id:"q14",u:5,stem:"<p>A net torque of 2.0 N·m acts on a uniform solid disk (M = 4.0 kg, R = 0.50 m) that rotates freely about its center. Use I = ½MR². What is its angular acceleration?</p>",ch:["1.0 rad/s²","2.0 rad/s²","4.0 rad/s²","8.0 rad/s²"],a:2,exp:"<p>I = ½(4.0)(0.50)² = 0.50 kg·m². α = τ/I = 2.0/0.50 = <b>4.0 rad/s²</b>.</p>"},
{id:"q15",u:5,stem:"<p>A door is hinged along one edge. Which force produces the largest torque about the hinge? (Each angle is measured between the force and the door.)</p>",ch:["10 N, applied 0.80 m from the hinge, at 90°","20 N, applied 0.40 m from the hinge, at 30°","15 N, applied 0.80 m from the hinge, at 30°","30 N, applied 0.20 m from the hinge, at 90°"],a:0,exp:"<p>τ = rF sin θ. (A) 0.80·10·1 = <b>8.0 N·m</b>; (B) 0.40·20·0.5 = 4.0; (C) 0.80·15·0.5 = 6.0; (D) 0.20·30·1 = 6.0. Lever arm and angle matter as much as the force.</p>"},
{id:"q16",u:6,stem:"<p>A spinning skater pulls her arms in, cutting her rotational inertia in half. Ignore friction with the ice. What happens to her rotational kinetic energy?</p>",ch:["It is cut in half","It stays the same","It doubles","It quadruples"],a:2,exp:"<p>No external torque, so L = Iω is conserved: halving I doubles ω. K = ½Iω² = L²/(2I), so K <b>doubles</b>. The extra energy comes from the work her muscles do pulling her arms in.</p>"},
{id:"q17",u:6,stem:"<p>A solid sphere, a hollow sphere, and a solid cylinder are released from rest at the same height on the same incline and roll without slipping. Which reaches the bottom first?</p>",ch:["The solid sphere","The hollow sphere","The solid cylinder","They tie"],a:0,exp:"<p>a = g sin θ / (1 + I/MR²). The solid sphere has the smallest I/MR² (2/5, vs. 1/2 for the cylinder and 2/3 for the hollow sphere), so less of its energy goes into spinning and it wins. Mass and radius don't matter.</p>",sim:"race"},
{id:"q18",u:6,stem:"<p>A flywheel with rotational inertia 0.50 kg·m² spins at 4.0 rad/s. What is its rotational kinetic energy?</p>",ch:["1.0 J","2.0 J","4.0 J","8.0 J"],a:2,exp:"<p>K = ½Iω² = ½(0.50)(4.0)² = <b>4.0 J</b>.</p>"},
{id:"q19",u:7,stem:"<p>A block on a spring oscillates with period T. The block is replaced with one of four times the mass. What is the new period?</p>",ch:["T/2","T","2T","4T"],a:2,exp:"<p>T = 2π√(m/k). Multiplying m by 4 multiplies T by √4 = 2, giving <b>2T</b>.</p>"},
{id:"q20",u:7,stem:"<p>A pendulum with a period of 2.0 s on Earth is taken to the Moon, where g is about 1/6 of Earth's value. Its period on the Moon is closest to:</p>",ch:["0.33 s","0.82 s","4.9 s","12 s"],a:2,exp:"<p>T = 2π√(L/g). Dividing g by 6 multiplies T by √6 ≈ 2.45: 2.0 × 2.45 ≈ <b>4.9 s</b>.</p>",sim:"pendulum"},
{id:"q21",u:7,stem:"<p>For a mass on a spring in simple harmonic motion, at the equilibrium position:</p>",ch:["speed is maximum and acceleration is zero","speed is zero and acceleration is maximum","speed and acceleration are both maximum","speed and acceleration are both zero"],a:0,exp:"<p>At equilibrium the spring force is zero, so <b>a = 0</b>, and all the energy is kinetic, so <b>speed is maximum</b>. At the turning points it's the reverse.</p>"},
{id:"q22",u:8,stem:"<p>A wooden block floats in fresh water (ρ = 1000 kg/m³) with 3/4 of its volume submerged. What is the block's density?</p>",ch:["250 kg/m³","750 kg/m³","1000 kg/m³","1330 kg/m³"],a:1,exp:"<p>Floating means buoyant force = weight: ρ<sub>w</sub>(¾V)g = ρ<sub>b</sub>Vg, so ρ<sub>b</sub> = ¾ × 1000 = <b>750 kg/m³</b>. The submerged fraction equals the density ratio.</p>"},
{id:"q23",u:8,stem:"<p>Atmospheric pressure is 1.0 × 10<sup>5</sup> Pa. What is the absolute pressure 20 m below the surface of a freshwater lake?</p>",ch:["1.0 × 10<sup>5</sup> Pa","2.0 × 10<sup>5</sup> Pa","3.0 × 10<sup>5</sup> Pa","4.0 × 10<sup>5</sup> Pa"],a:2,exp:"<p>P = P<sub>0</sub> + ρgh = 1.0×10<sup>5</sup> + (1000)(10)(20) = <b>3.0 × 10<sup>5</sup> Pa</b>. The 2.0 × 10<sup>5</sup> answer is the gauge pressure only.</p>"},
{id:"q24",u:8,stem:"<p>Water flows steadily through the horizontal pipe shown. The pipe narrows from area A to A/3. In the narrow section, the water's speed and pressure are:</p>",fig:"pipe",ch:["6.0 m/s, lower pressure","6.0 m/s, higher pressure","0.67 m/s, higher pressure","2.0 m/s, the same pressure"],a:0,exp:"<p>Continuity: A·2.0 = (A/3)v, so v = <b>6.0 m/s</b>. Bernoulli for a horizontal pipe: where speed goes up, pressure goes <b>down</b>. The pressure difference is what accelerates the water into the narrow section.</p>"}

function startScope(){
  const cv=$("#scope");if(!cv)return;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let t0=performance.now(),raf;
  function draw(now){
    const dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
    if(cv.width!==Math.round(w*dpr)){cv.width=w*dpr;cv.height=h*dpr}
    const c=cv.getContext("2d");c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);
    c.strokeStyle=css("rule");c.lineWidth=1;
    for(let x=0;x<w;x+=24){c.beginPath();c.moveTo(x+.5,0);c.lineTo(x+.5,h);c.stroke()}
    for(let y=h/2%24;y<h;y+=24){c.beginPath();c.moveTo(0,y+.5);c.lineTo(w,y+.5);c.stroke()}
    c.strokeStyle=css("muted");c.beginPath();c.moveTo(0,h/2);c.lineTo(w,h/2);c.stroke();
    const T=reduce?1:(((now-t0)/4200)%1.25);const sweep=Math.min(1,T)*w;
    const f=x=>{const s=x/w*7.5;return h/2-(h*.4)*Math.exp(-.32*s)*Math.cos(2*Math.PI*s*.95)};
    c.strokeStyle=css("vel");c.globalAlpha=.25;c.lineWidth=1.5;c.beginPath();
    for(let x=0;x<=w;x+=2){const y=h/2-(h*.4)*Math.exp(-.32*x/w*7.5);x?c.lineTo(x,y):c.moveTo(x,y)}c.stroke();
    c.beginPath();for(let x=0;x<=w;x+=2){const y=h/2+(h*.4)*Math.exp(-.32*x/w*7.5);x?c.lineTo(x,y):c.moveTo(x,y)}c.stroke();
    c.globalAlpha=1;c.strokeStyle=css("force");c.lineWidth=2.4;c.beginPath();
    for(let x=0;x<=sweep;x+=1.5){x?c.lineTo(x,f(x)):c.moveTo(x,f(x))}c.stroke();
    if(sweep<w&&!reduce){c.fillStyle=css("force");c.beginPath();c.arc(sweep,f(sweep),5,0,7);c.fill()}
    if(!reduce)raf=requestAnimationFrame(draw);
  }
  raf=requestAnimationFrame(draw);
  scopeStop=()=>cancelAnimationFrame(raf);
}

function barsHTML(bars,fb){

}

/* graph (FRQ1c) */
let gDrag=null;
function graphGeom(cv){const w=cv.clientWidth,h=cv.clientHeight;return{w,h,l:52,r:w-16,t:16,b:h-40}}
function drawGraph(){
  const cv=$("#graph");if(!cv)return;
  const ax=AXES[S.frq.f1b];
  const dpr=devicePixelRatio||1;cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr;
  const c=cv.getContext("2d");c.setTransform(dpr,0,0,dpr,0,0);
  const G=graphGeom(cv);c.clearRect(0,0,G.w,G.h);
  c.font="11px "+css("mono");
  if(!ax){c.fillStyle=css("muted");c.textAlign="center";c.fillText("Choose axes in part (b) to plot the data",G.w/2,G.h/2);$("#slopeRo").textContent="—";$("#axRo").textContent="";return}
  const X=v=>G.l+(v/ax.xm)*(G.r-G.l),Y=v=>G.b-(v/ax.ym)*(G.b-G.t);
  const xs=ax.xm/6,ys=ax.ym/5;
  c.strokeStyle=css("rule");c.lineWidth=1;c.fillStyle=css("muted");
  for(let i=0;i<=6;i++){const x=X(i*xs);c.beginPath();c.moveTo(x,G.t);c.lineTo(x,G.b);c.stroke();c.textAlign="center";c.fillText((i*xs).toFixed(ax.xm>2?0:1),x,G.b+15)}
  for(let i=0;i<=5;i++){const y=Y(i*ys);c.beginPath();c.moveTo(G.l,y);c.lineTo(G.r,y);c.stroke();c.textAlign="right";c.fillText((i*ys).toFixed(ax.ym>3?0:1),G.l-6,y+4)}
  c.strokeStyle=css("ink");c.lineWidth=1.5;c.beginPath();c.moveTo(G.l,G.t);c.lineTo(G.l,G.b);c.lineTo(G.r,G.b);c.stroke();
  c.fillStyle=css("ink");c.textAlign="center";c.fillText(ax.x,(G.l+G.r)/2,G.h-6);
  c.save();c.translate(13,(G.t+G.b)/2);c.rotate(-Math.PI/2);c.fillText(ax.y,0,0);c.restore();
  c.fillStyle=css("vel");PEND.forEach(p=>{c.beginPath();c.arc(X(ax.fx(p)),Y(ax.fy(p)),5,0,7);c.fill()});
  let L=S.frq.f1g;if(!L||L.ax!==S.frq.f1b){L={ax:S.frq.f1b,p:[[ax.xm*.08,ax.ym*.25],[ax.xm*.9,ax.ym*.55]]};S.frq.f1g=L}
  const [p1,p2]=L.p,m=(p2[1]-p1[1])/(p2[0]-p1[0]||1e-9);
  const ext=x=>p1[1]+m*(x-p1[0]);
  c.save();c.beginPath();c.rect(G.l,G.t,G.r-G.l,G.b-G.t);c.clip();
  c.strokeStyle=css("force");c.lineWidth=2;c.setLineDash([6,5]);c.beginPath();c.moveTo(X(0),Y(ext(0)));c.lineTo(X(ax.xm),Y(ext(ax.xm)));c.stroke();c.setLineDash([]);c.restore();
  [p1,p2].forEach(p=>{c.fillStyle=css("surface");c.strokeStyle=css("force");c.lineWidth=3;c.beginPath();c.arc(X(p[0]),Y(p[1]),9,0,7);c.fill();c.stroke()});
  const units=S.frq.f1b==="T2L"?" s²/m":S.frq.f1b==="TL"?" s/m":" s·m";
  $("#slopeRo").textContent=m.toFixed(2)+units;
  $("#axRo").textContent=S.frq.f1b==="T2L"?"g = 4π² / slope":S.frq.f1b==="TL"?"These points curve: no single slope fits":"These points curve: try another pair of axes";
  cv._map={X,Y,ax,G};
}
function graphPointer(e){
  const cv=$("#graph");if(!cv||!cv._map||showFb("f1"))return;
  const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,{X,Y,ax,G}=cv._map,L=S.frq.f1g;
  if(e.type==="pointerdown"){L.p.forEach((p,k)=>{if(Math.hypot(X(p[0])-px,Y(p[1])-py)<22)gDrag=k});if(gDrag!=null){cv.setPointerCapture(e.pointerId);cv.style.cursor="grabbing"}}
  else if(e.type==="pointermove"&&gDrag!=null){
    const vx=Math.min(ax.xm,Math.max(0,(px-G.l)/(G.r-G.l)*ax.xm)),vy=Math.min(ax.ym,Math.max(0,(G.b-py)/(G.b-G.t)*ax.ym));
    L.p[gDrag]=[vx,vy];drawGraph();save();
  }else if(e.type==="pointerup"||e.type==="pointercancel"){gDrag=null;cv.style.cursor=""}
}

/* ---------- scoring ---------- */
function slopeOf(){const L=S.frq.f1g;if(!L)return null;const[p1,p2]=L.p;return(p2[1]-p1[1])/(p2[0]-p1[0]||1e-9)}
function scoreF1auto(){
  const b=S.frq.f1b==="T2L"?1:0;let c=0,notes=[];
  const m=slopeOf();
  if(S.frq.f1b==="T2L"&&m!=null&&m>=3.75&&m<=4.35){c++;notes.push("slope fits the data")}else notes.push("best-fit slope of T² vs. L should be about 4.0 s²/m");
  const g=parseFloat(S.frq.f1g_val);
  if(g>=9.2&&g<=10.4){c++;notes.push("g in range")}else notes.push("g = 4π²/4.0 ≈ 9.8 m/s²");
  return{b,c,cNote:notes.join("; ")};
}
function scoreBars(){const bars=S.frq.f2bars;if(!bars)return 0;return["A","B","C"].filter(k=>bars[k].every((v,j)=>v===BAR_KEY[k][j])).length}
function rubPts(pid){return TEXT[pid].rub.reduce((s,r,k)=>s+(S.rub[pid+"_"+k]?r[0]:0),0)}
function totals(){
  const mcqIds=S.order.filter(id=>!isFrq(id));
  const mcqOk=mcqIds.filter(id=>S.ans[id]===byId(id).a).length;
  const frqIds=S.order.filter(isFrq);let fp=0,fm=0;
  if(frqIds.includes("f1")){const a=scoreF1auto();fp+=a.b+a.c+rubPts("f1a")+rubPts("f1d");fm+=7}
  if(frqIds.includes("f2")){fp+=scoreBars()+rubPts("f2a")+rubPts("f2c");fm+=9}
  const parts=[];if(mcqIds.length)parts.push(mcqOk/mcqIds.length);if(fm)parts.push(fp/fm);
  const comp=parts.length?parts.reduce((a,b)=>a+b,0)/parts.length*100:0;
  const ap=comp>=70?5:comp>=55?4:comp>=40?3:comp>=27?2:1;
  return{mcqIds,mcqOk,fp,fm,comp,ap};
}

/* ---------- simulations ---------- */
function setupCanvas(cv,h){const dpr=devicePixelRatio||1,w=cv.clientWidth;cv.style.height=h+"px";cv.width=w*dpr;cv.height=h*dpr;const c=cv.getContext("2d");c.setTransform(dpr,0,0,dpr,0,0);return{c,w,h}}
function arrow(c,x1,y1,x2,y2,col,lw){const a=Math.atan2(y2-y1,x2-x1),L=Math.hypot(x2-x1,y2-y1);if(L<2)return;c.strokeStyle=col;c.fillStyle=col;c.lineWidth=lw||2.5;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2-7*Math.cos(a),y2-7*Math.sin(a));c.stroke();c.beginPath();c.moveTo(x2,y2);c.lineTo(x2-11*Math.cos(a-.4),y2-11*Math.sin(a-.4));c.lineTo(x2-11*Math.cos(a+.4),y2-11*Math.sin(a+.4));c.closePath();c.fill()}
function bench(el,title,sub,ctrls){el.innerHTML=`<div class="bench-h"><b>Lab bench</b><span>${title}</span></div><canvas></canvas><div class="ctrls">${ctrls}</div><div class="readouts" id="ro"></div>`;
  el.querySelectorAll("input[type=range]").forEach(r=>{const o=el.querySelector(`output[for="${r.id}"]`);const f=()=>o.textContent=r.value+(r.dataset.u||"");f();r.addEventListener("input",f)});return el.querySelector("canvas")}
const slider=(id,lab,min,max,step,val,u)=>`<div class="ctrl"><label for="${id}">${lab}<output for="${id}"></output></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" data-u="${u}"></div>`;
const SIMS={
projectile(el){
  const cv=bench(el,"Horizontal launch. Change the cliff and the speed, then fire.","",slider("pH","Cliff height",5,80,1,45," m")+slider("pV","Launch speed",0,30,1,12," m/s")+`<button class="btn primary" id="pGo">${ICON.play}Launch</button>`);
  const g=10;let t=null,raf,last;
  function draw(){
    const H=+$("#pH").value,v=+$("#pV").value,tf=Math.sqrt(2*H/g),R=v*tf;
    const {c,w,h}=setupCanvas(cv,260);const pad=16,cliffW=56,xmax=Math.max(R*1.12,30),ymax=Math.max(H*1.15,20);
    const sx=(w-cliffW-pad*2)/xmax,sy=(h-40)/ymax,sc=Math.min(sx,sy*1.6);
    const X=x=>pad+cliffW+x*sx,Y=y=>h-24-y*sy;
    c.clearRect(0,0,w,h);c.fillStyle=css("surface-2");c.fillRect(pad,Y(H),cliffW,h-24-Y(H));c.strokeStyle=css("ink");c.lineWidth=1.5;c.strokeRect(pad,Y(H),cliffW,h-24-Y(H));
    c.beginPath();c.moveTo(0,h-24);c.lineTo(w,h-24);c.stroke();
    c.font="11px "+css("mono");c.fillStyle=css("muted");
    for(let x=0;x<=xmax;x+=xmax>60?20:10){c.fillText(x+"",X(x)-4,h-8)}
    c.strokeStyle=css("vel");c.globalAlpha=.35;c.setLineDash([4,4]);c.lineWidth=1.5;c.beginPath();
    for(let k=0;k<=60;k++){const tt=tf*k/60;const x=X(v*tt),y=Y(H-.5*g*tt*tt);k?c.lineTo(x,y):c.moveTo(x,y)}c.stroke();c.setLineDash([]);c.globalAlpha=1;
    const tt=t==null?0:Math.min(t,tf);const bx=X(v*tt),by=Y(H-.5*g*tt*tt);
    if(t!=null){c.strokeStyle=css("vel");c.lineWidth=2.5;c.beginPath();for(let k=0;k<=40;k++){const s=tt*k/40;const x=X(v*s),y=Y(H-.5*g*s*s);k?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()}
    arrow(c,bx,by,bx+v*2.2,by,css("vel"),2);arrow(c,bx,by,bx,by+g*tt*2.2,css("vel"),2);
    arrow(c,bx,by,bx,by+26,css("force"),2);
    c.fillStyle=css("ink");c.beginPath();c.arc(bx,by,6,0,7);c.fill();
    if(t!=null&&t>=tf){c.fillStyle=css("force");c.beginPath();c.moveTo(X(R),h-24);c.lineTo(X(R)-5,h-34);c.lineTo(X(R)+5,h-34);c.fill();c.fillStyle=css("ink");c.fillText(R.toFixed(1)+" m",X(R)-14,h-40)}
    $("#ro").innerHTML=`<span>t<sub>flight</sub> = <b>${tf.toFixed(2)} s</b></span><span>range = <b>${R.toFixed(1)} m</b></span><span>v<sub>y</sub> at impact = <b>${(g*tf).toFixed(1)} m/s</b></span><span style="color:var(--muted)">blue: velocity parts · red: gravity</span>`;
  }
  function loop(now){t+=(now-last)/1000;last=now;draw();const tf=Math.sqrt(2*+$("#pH").value/g);if(t<tf)raf=requestAnimationFrame(loop)}
  $("#pGo").onclick=()=>{cancelAnimationFrame(raf);t=0;last=performance.now();raf=requestAnimationFrame(loop)};
  el.querySelectorAll("input").forEach(i=>i.addEventListener("input",()=>{cancelAnimationFrame(raf);t=null;draw()}));
  draw();simStop=()=>cancelAnimationFrame(raf);
},
incline(el){
  const cv=bench(el,"Tilt the ramp. Friction matches gravity's pull down the slope until it can't.","",slider("iA","Incline angle θ",0,60,1,25,"°")+slider("iM","Static coefficient μs",0.1,1,0.05,0.5,""));
  function draw(){
    const th=+$("#iA").value*Math.PI/180,mu=+$("#iM").value,m=2,g=10;
    const {c,w,h}=setupCanvas(cv,280);c.clearRect(0,0,w,h);
    const ox=40,oy=h-30,len=Math.min(w-80,520),tx=ox+len*Math.cos(th),ty=oy-len*Math.sin(th);
    c.fillStyle=css("surface-2");c.strokeStyle=css("ink");c.lineWidth=1.5;c.beginPath();c.moveTo(ox,oy);c.lineTo(ox+len*Math.cos(th),oy);c.lineTo(tx,ty);c.closePath();c.fill();c.stroke();
    c.strokeStyle=css("muted");c.beginPath();c.arc(ox,oy,36,-th,0);c.stroke();c.font="12px "+css("mono");c.fillStyle=css("ink");c.fillText("θ",ox+42,oy-6);
    const d=len*.55,bx=ox+d*Math.cos(th),by=oy-d*Math.sin(th),nx=-Math.sin(th),ny=-Math.cos(th);
    const cx=bx+nx*18,cy=by+ny*18;
    c.save();c.translate(cx,cy);c.rotate(-th);c.fillStyle=css("surface");c.strokeStyle=css("ink");c.fillRect(-22,-18,44,36);c.strokeRect(-22,-18,44,36);c.restore();
    const W=m*g,N=W*Math.cos(th),down=W*Math.sin(th),fmax=mu*N,slides=down>fmax+1e-9,f=slides?fmax:down,k=4.2;
    arrow(c,cx,cy,cx,cy+W*k,css("force"));
    arrow(c,cx,cy,cx+nx*N*k,cy+ny*N*k,css("force"));
    arrow(c,cx,cy,cx+Math.cos(th)*f*k,cy-Math.sin(th)*f*k,css("force"));
    c.setLineDash([4,4]);arrow(c,cx,cy,cx-Math.cos(th)*down*k,cy+Math.sin(th)*down*k,css("vel"),1.5);c.setLineDash([]);
    c.fillStyle=css("ink");c.fillText("mg",cx+6,cy+W*k-4);c.fillText("N",cx+nx*N*k-14,cy+ny*N*k);c.fillText("f",cx+Math.cos(th)*f*k+6,cy-Math.sin(th)*f*k-4);
    $("#ro").innerHTML=`<span>mg sin θ = <b>${down.toFixed(1)} N</b></span><span>f<sub>s,max</sub> = μ<sub>s</sub>N = <b>${fmax.toFixed(1)} N</b></span><span>friction now = <b>${f.toFixed(1)} N</b></span><span style="color:${slides?"var(--bad)":"var(--good)"}">${slides?"✕ slides: tan θ > μs":"✓ holds: friction = mg sin θ"}</span>`;
  }
  el.querySelectorAll("input").forEach(i=>i.addEventListener("input",draw));draw();
},
race(el){
  const cv=bench(el,"Same height, same ramp. Watch rotational inertia decide the race.","",slider("rA","Incline angle",5,40,1,15,"°")+`<button class="btn primary" id="rGo">${ICON.play}Race</button>`);
  const R=[{n:"Solid sphere",c:.4},{n:"Solid cylinder",c:.5},{n:"Hollow sphere",c:2/3},{n:"Hoop",c:1}];
  const Ld=3;let t=null,raf,last;
  function draw(){
    const th=+$("#rA").value*Math.PI/180;const {c,w,h}=setupCanvas(cv,250);c.clearRect(0,0,w,h);
    const lane=(h-20)/4,x0=120,x1=w-30,rad=Math.min(13,lane/2-6);
    c.font="12px "+css("body");
    R.forEach((r,k)=>{
      const a=10*Math.sin(th)/(1+r.c),tf=Math.sqrt(2*Ld/a),tt=t==null?0:Math.min(t,tf),s=.5*a*tt*tt,x=x0+rad+(x1-x0-2*rad)*s/Ld,y=10+lane*k+lane/2;
      c.strokeStyle=css("rule");c.lineWidth=1;c.beginPath();c.moveTo(x0,y+rad+1);c.lineTo(x1,y+rad+1);c.stroke();
      c.fillStyle=css("ink");c.textAlign="left";c.fillText(r.n,8,y+4);
      const ang=s/(.1);
      c.fillStyle=css(k===0?"force":"surface-2");c.strokeStyle=css("ink");c.lineWidth=1.5;
      if(r.n==="Hoop"||r.n==="Hollow sphere"){c.lineWidth=r.n==="Hoop"?4:2.5;c.strokeStyle=css(k===0?"force":"vel")}
      c.beginPath();c.arc(x,y,rad,0,7);if(r.n!=="Hoop")c.fill();c.stroke();
      c.strokeStyle=css("ink");c.lineWidth=1.5;c.beginPath();c.moveTo(x,y);c.lineTo(x+rad*Math.cos(ang),y+rad*Math.sin(ang));c.stroke();
      if(t!=null&&t>=tf){c.fillStyle=css("muted");c.textAlign="right";c.font="11px "+css("mono");c.fillText(tf.toFixed(2)+" s",x1,y-rad-2);c.font="12px "+css("body")}
    });
    c.strokeStyle=css("force");c.setLineDash([3,3]);c.beginPath();c.moveTo(x1,6);c.lineTo(x1,h-6);c.stroke();c.setLineDash([]);
    $("#ro").innerHTML=R.map(r=>`<span>${r.n}: I/MR² = <b>${r.c===2/3?"2/3":r.c}</b></span>`).join("")+`<span style="color:var(--muted)">Times shown for a ${Ld} m ramp. Change the angle: the order never changes.</span>`;
  }
  function loop(now){t+=(now-last)/1000;last=now;draw();const th=+$("#rA").value*Math.PI/180;if(t<Math.sqrt(2*Ld/(10*Math.sin(th)/2)))raf=requestAnimationFrame(loop)}
  $("#rGo").onclick=()=>{cancelAnimationFrame(raf);t=0;last=performance.now();raf=requestAnimationFrame(loop)};
  $("#rA").addEventListener("input",()=>{cancelAnimationFrame(raf);t=null;draw()});
  draw();simStop=()=>cancelAnimationFrame(raf);
},
pendulum(el){
  const cv=bench(el,"Swing it on different worlds. Length and g set the period; mass does not.","",slider("dL","String length",0.2,2,0.05,1," m")+`<div class="ctrl"><label for="dG">Location</label><select id="dG"><option value="9.8">Earth · 9.8 m/s²</option><option value="1.62">Moon · 1.62 m/s²</option><option value="3.71">Mars · 3.71 m/s²</option><option value="24.8">Jupiter · 24.8 m/s²</option></select></div>`);
  let raf,t0=performance.now();
  function frame(now){
    const L=+$("#dL").value,g=+$("#dG").value,T=2*Math.PI*Math.sqrt(L/g),t=(now-t0)/1000,th=.32*Math.cos(2*Math.PI*t/T);
    const {c,w,h}=setupCanvas(cv,270);c.clearRect(0,0,w,h);
    const px=w/2,py=16,scale=(h-50)/2,len=L*scale;
    c.strokeStyle=css("ink");c.lineWidth=3;c.beginPath();c.moveTo(px-60,py);c.lineTo(px+60,py);c.stroke();
    c.strokeStyle=css("rule");c.lineWidth=1;c.setLineDash([3,4]);c.beginPath();c.moveTo(px,py);c.lineTo(px,py+len+20);c.stroke();c.setLineDash([]);
    c.strokeStyle=css("vel");c.globalAlpha=.25;c.lineWidth=1.5;c.beginPath();c.arc(px,py,len,Math.PI/2-.32,Math.PI/2+.32);c.stroke();c.globalAlpha=1;
    const bx=px+len*Math.sin(th),by=py+len*Math.cos(th);
    c.strokeStyle=css("ink");c.lineWidth=1.5;c.beginPath();c.moveTo(px,py);c.lineTo(bx,by);c.stroke();
    c.fillStyle=css("force");c.beginPath();c.arc(bx,by,11,0,7);c.fill();
    const prog=(t%T)/T;c.strokeStyle=css("force");c.lineWidth=4;c.beginPath();c.arc(w-46,46,24,-Math.PI/2,-Math.PI/2+prog*2*Math.PI);c.stroke();
    c.strokeStyle=css("rule");c.lineWidth=1;c.beginPath();c.arc(w-46,46,24,0,7);c.stroke();
    c.fillStyle=css("ink");c.font="11px "+css("mono");c.textAlign="center";c.fillText(Math.floor(t/T)+"",w-46,50);c.fillText("swings",w-46,86);
    $("#ro").innerHTML=`<span>T = 2π√(L/g) = <b>${T.toFixed(2)} s</b></span><span>on Earth this length gives <b>${(2*Math.PI*Math.sqrt(L/9.8)).toFixed(2)} s</b></span><span>ratio = <b>${(T/(2*Math.PI*Math.sqrt(L/9.8))).toFixed(2)}×</b></span>`;
    raf=requestAnimationFrame(frame);
  }
  $("#dG").addEventListener("change",()=>t0=performance.now());$("#dL").addEventListener("input",()=>t0=performance.now());
  raf=requestAnimationFrame(frame);simStop=()=>cancelAnimationFrame(raf);
}
};

/* ---------- drawers ---------- */
const EQS=[["Kinematics",[["v = v₀ + at","constant acceleration"],["x = x₀ + v₀t + ½at²",""],["v² = v₀² + 2a(x − x₀)",""],["Δx = area under v–t","graphs"]]],
["Dynamics",[["ΣF = ma",""],["|f<sub>s</sub>| ≤ μ<sub>s</sub>|N|, |f<sub>k</sub>| = μ<sub>k</sub>|N|","friction"],["F<sub>s</sub> = −kΔx","Hooke's law"],["F<sub>g</sub> = Gm₁m₂/r²","G = 6.67×10⁻¹¹ N·m²/kg²"],["a<sub>c</sub> = v²/r","circular motion"]]],
["Energy & power",[["K = ½mv²",""],["ΔU<sub>g</sub> = mgΔy","near Earth"],["U<sub>s</sub> = ½k(Δx)²",""],["W = Fd cos θ",""],["P = ΔE/Δt = Fv cos θ",""]]],
["Momentum",[["p = mv",""],["J = F<sub>avg</sub>Δt = Δp","area under F–t"],["Σp<sub>i</sub> = Σp<sub>f</sub>","no net external force"],["x<sub>cm</sub> = Σmx / Σm",""]]],
["Rotation",[["ω = ω₀ + αt","and rotational analogs"],["v = rω, a<sub>t</sub> = rα",""],["τ = rF sin θ",""],["Στ = Iα",""],["I = Σmr², I = I<sub>cm</sub> + Md²",""],["K = ½Iω², L = Iω","ΔL = τΔt"]]],
["Oscillations",[["T = 1/f = 2π/ω",""],["T<sub>s</sub> = 2π√(m/k)","mass on spring"],["T<sub>p</sub> = 2π√(L/g)","small-angle pendulum"],["x = A cos(2πft)",""]]],
["Fluids",[["ρ = m/V",""],["P = F/A",""],["P = P₀ + ρgh",""],["F<sub>b</sub> = ρVg","Archimedes"],["A₁v₁ = A₂v₂","continuity"],["P₁ + ρgy₁ + ½ρv₁² = P₂ + ρgy₂ + ½ρv₂²","Bernoulli"]]],
["Constants",[["g = 9.8 m/s² ≈ 10 m/s²","this test uses 10"],["ρ<sub>water</sub> = 1000 kg/m³",""],["1 atm = 1.0×10⁵ Pa",""]]]];
function renderLayer(){
  let h="";
  if(ui.drawer==="eqs")h+=`<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-label="Equation sheet"><div class="drawer-h"><h2>Equation sheet</h2><button class="btn ghost" data-act="close" aria-label="Close">${ICON.x}</button></div><div class="drawer-b eqs">${EQS.map(([t,r])=>`<h3>${t}</h3><table>${r.map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join("")}</table>`).join("")}</div></aside>`;
  if(ui.modal)h+=`<div class="scrim" data-act="closemodal"></div><div class="modal" role="dialog" aria-modal="true">${ui.modal}</div>`;
  if(ui.calc)h+=calcHTML();
  $("#layer").innerHTML=h;
  if(ui.calc){const i=$("#cin");i.value=calc.expr;i.focus();upCalc()}
}
/* calculator */
const calc={expr:"",deg:true,hist:[]};
function calcHTML(){
  const K=[["sin(","fn"],["cos(","fn"],["tan(","fn"],["√(","fn"],["^","op"],["7"],["8"],["9"],["(","op"],[")","op"],["4"],["5"],["6"],["×","op"],["÷","op"],["1"],["2"],["3"],["+","op"],["−","op"],["0"],["."],["π","fn"],["⌫","op"],["=","eq"]];
  return `<div class="calc" role="dialog" aria-label="Calculator"><div class="calc-h"><span class="sp">Calculator</span><button class="btn ghost" id="cdeg" style="padding:.25em .55em;font-size:.78rem">${calc.deg?"DEG":"RAD"}</button><button class="btn ghost" data-act="calc" aria-label="Close calculator" style="padding:.3em">${ICON.x}</button></div>
  <div class="calc-screen"><input id="cin" aria-label="Expression" autocomplete="off" spellcheck="false" placeholder="e.g. 2*pi*sqrt(0.8/9.8)"><div class="calc-out" id="cout">0</div></div>
  <div class="calc-keys">${K.map(([k,c])=>`<button class="ck ${c||""}" data-ck="${k}">${k}</button>`).join("")}</div>
  <div class="hist" id="chist">${calc.hist.map(h=>`<div data-hist="${esc(h[1])}">${esc(h[0])} = ${esc(h[1])}</div>`).join("")}</div></div>`;
}
function evalExpr(src,deg){
  let s=src.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/π/g,"pi").replace(/√/g,"sqrt").replace(/\s+/g,""),i=0;
  const tr=deg?Math.PI/180:1;
  const F={sin:x=>Math.sin(x*tr),cos:x=>Math.cos(x*tr),tan:x=>Math.tan(x*tr),asin:x=>Math.asin(x)/tr,acos:x=>Math.acos(x)/tr,atan:x=>Math.atan(x)/tr,sqrt:Math.sqrt,ln:Math.log,log:Math.log10,abs:Math.abs,exp:Math.exp};
  const Cn={pi:Math.PI,e:Math.E,g:9.8};
  function expr(){let v=term();while(s[i]==="+"||s[i]==="-"){const o=s[i++];const r=term();v=o==="+"?v+r:v-r}return v}
  function term(){let v=unary();while(s[i]==="*"||s[i]==="/"){const o=s[i++];const r=unary();v=o==="*"?v*r:v/r}return v}
  function unary(){if(s[i]==="-"){i++;return-unary()}if(s[i]==="+"){i++;return unary()}return power()}
  function power(){const b=prim();if(s[i]==="^"){i++;return Math.pow(b,unary())}return b}
  function prim(){
    const m=/^(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/i.exec(s.slice(i));
    if(m){i+=m[0].length;return parseFloat(m[0])}
    if(s[i]==="("){i++;const v=expr();if(s[i]!==")")throw Error("Missing )");i++;return v}
    const id=/^[a-z]+/i.exec(s.slice(i));
    if(id){const n=id[0].toLowerCase();i+=id[0].length;
      if(F[n]){if(s[i]!=="(")throw Error(n+" needs (");i++;const v=expr();if(s[i]!==")")throw Error("Missing )");i++;return F[n](v)}
      if(n in Cn)return Cn[n];throw Error("Unknown: "+n)}
    throw Error(i>=s.length?"Incomplete expression":"Unexpected "+s[i]);
  }
  if(!s)return null;const v=expr();if(i<s.length)throw Error("Unexpected "+s[i]);return v;
}
function niceNum(v){if(!isFinite(v))return"undefined";const a=Math.abs(v);if(a!==0&&(a<1e-4||a>=1e9))return v.toExponential(4);return String(+v.toPrecision(10))}
function upCalc(){const o=$("#cout");if(!o)return;try{const v=evalExpr(calc.expr,calc.deg);o.className="calc-out";o.textContent=v==null?"0":niceNum(v)}catch(e){o.className="calc-out err";o.textContent=e.message}}
function calcEnter(){try{const v=evalExpr(calc.expr,calc.deg);if(v==null)return;const r=niceNum(v);calc.hist.unshift([calc.expr,r]);calc.hist=calc.hist.slice(0,8);calc.expr=r;renderLayer()}catch(e){upCalc()}}

/* ---------- flow ---------- */
function render(){
  if(scopeStop){scopeStop();scopeStop=null}
  if(simStop){simStop();simStop=null}
  renderTop();
  if(S.phase==="start")renderStart();
  else if(S.phase==="exam"||S.phase==="review")renderExam();
  else renderResults();
  renderLayer();
}
function go(i){if(i<0||i>=S.order.length)return;S.cur=i;save();renderQ();renderRail();window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}
function askSubmit(){
  const un=S.order.filter(id=>!answeredQ(id)).length,fl=S.order.filter(id=>S.flags[id]).length;
  ui.modal=`<h2>${S.mode==="exam"?"Submit your exam?":"Finish practice?"}</h2>${un?`<p><b style="color:var(--bad)">${un}</b> question${un>1?"s are":" is"} still unanswered.</p>`:"<p>Every question has an answer.</p>"}${fl?`<p><b style="color:var(--warn)">${fl}</b> flagged for review.</p>`:""}<p>${S.mode==="exam"?"You can't change answers after submitting.":"You can still review everything afterward."}</p><div class="row"><button class="btn" data-act="closemodal">Keep working</button><button class="btn primary" data-act="dosubmit">Submit</button></div>`;
  renderLayer();
}
function submit(){ui.modal=null;S.phase="results";S._active=false;S.order.forEach(id=>{if(!isFrq(id))S.checked[id]=true});save();render();window.scrollTo(0,0)}

setInterval(()=>{
  if(S.phase!=="exam"||document.hidden)return;
  S.elapsed++;tickClock();
  if(S.elapsed%5===0)save();
  if(S.mode==="exam"&&S.elapsed>=S.limit){submit();toast("Time's up. Your exam was submitted.")}
},1000);

document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-act]");if(!t)return;
  const d=t.dataset;
  if(d.mode){ui.mode=d.mode;renderStart();return}
  if(d.unit){const u=+d.unit;S.units=S.units.includes(u)?S.units.filter(x=>x!==u):[...S.units,u].sort();save();t.setAttribute("aria-pressed",S.units.includes(u));return}
  if(d.go!=null){go(+d.go);return}
  if(d.pick!=null){const id=curId();if(showFb(id))return;S.ans[id]=+d.pick;const st=S.struck[id];if(st)S.struck[id]=st.filter(x=>x!==+d.pick);save();renderQ();renderRail();return}
  if(d.strike!=null){const id=curId(),v=+d.strike,st=S.struck[id]||[];S.struck[id]=st.includes(v)?st.filter(x=>x!==v):[...st,v];if(S.struck[id].includes(S.ans[id]))delete S.ans[id];save();renderQ();renderRail();return}
  if(d.bar){const [k,j,lv]=d.bar.split(".");const b=S.frq.f2bars||(S.frq.f2bars={A:[0,0,0,0],B:[0,0,0,0],C:[0,0,0,0]});b[k][+j]=b[k][+j]===+lv?+lv-1:+lv;save();$("#bars").innerHTML=barsHTML(b,false);renderRail();return}
  if(d.reveal){ui.reveal=ui.reveal||{};ui.reveal[d.reveal]=true;const ta=$("#ta_"+d.reveal);t.closest(".qactions").outerHTML=rubricHTML(d.reveal);return}
  if(d.review!=null){S.phase="review";S.cur=+d.review;save();render();window.scrollTo(0,0);return}
  if(d.filter){ui.filter=d.filter;renderResults();return}
  if(d.hist){calc.expr=d.hist;renderLayer();return}
  if(d.ck){const k=d.ck;if(k==="=")calcEnter();else{if(k==="⌫")calc.expr=calc.expr.slice(0,-1);else calc.expr+=k;$("#cin").value=calc.expr;upCalc();$("#cin").focus()}return}
  if(t.id==="cdeg"){calc.deg=!calc.deg;renderLayer();return}
  switch(d.act){
    case "begin":begin();break;
    case "resume":S.phase="exam";render();break;
    case "eqs":ui.drawer=ui.drawer==="eqs"?null:"eqs";renderLayer();break;
    case "calc":ui.calc=!ui.calc;renderLayer();break;
    case "close":ui.drawer=null;renderLayer();break;
    case "closemodal":ui.modal=null;renderLayer();break;
    case "flag":{const id=curId();S.flags[id]=!S.flags[id];save();renderQ();renderRail();break}
    case "prev":go(S.cur-1);break;
    case "next":go(S.cur+1);break;
    case "check":{const id=curId();if(!isFrq(id)&&S.ans[id]==null)return;S.checked[id]=true;save();renderQ();renderRail();break}
    case "submit":askSubmit();break;
    case "dosubmit":submit();break;
    case "toresults":S.phase="results";save();render();break;
    case "quit":if(S.phase==="review"){S=Object.assign(fresh(),{mode:S.mode,units:S.units,withFrq:S.withFrq})}else S.phase="start";ui.mode=S.mode;save();render();break;
    case "new":S=Object.assign(fresh(),{mode:S.mode,units:S.units,withFrq:S.withFrq});ui.mode=S.mode;save();render();break;
    case "retry":{const missed=S.order.filter(id=>!isFrq(id)&&S.ans[id]!==byId(id).a);const keep={units:S.units,withFrq:S.withFrq};S=fresh();Object.assign(S,keep);S.mode="practice";S.order=missed;S.phase="exam";S._active=true;
      MCQ.forEach(q=>{const p=[0,1,2,3];for(let i=3;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]]}S.perm[q.id]=p});save();render();window.scrollTo(0,0);break}
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.frq){S.frq[t.dataset.frq]=t.value;save();renderRailSoon()}
  if(t.dataset.frqnum){S.frq[t.dataset.frqnum]=t.value;save();renderRailSoon()}
  if(t.id==="cin"){calc.expr=t.value;upCalc()}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="withFrq"){S.withFrq=t.checked;save()}
  if(t.dataset.frqsel){S.frq[t.dataset.frqsel]=t.value;save();drawGraph();renderRail()}
  if(t.dataset.rub){S.rub[t.dataset.rub]=t.checked;save();const el=$("#frqTot");if(el){const T=totals();el.innerHTML=`${T.fp}<small>/${T.fm}</small>`;const ap=document.querySelector(".tile.ap .big");if(ap)ap.textContent=T.ap;const nt=document.querySelector(".tile.ap .note");if(nt)nt.textContent=`Rough estimate from a ${Math.round(T.comp)}/100 composite. Real cutoffs shift every year.`}}
});
let rrT;function renderRailSoon(){clearTimeout(rrT);rrT=setTimeout(()=>{if($("#rail"))renderRail()},300)}
["pointerdown","pointermove","pointerup","pointercancel"].forEach(ev=>document.addEventListener(ev,e=>{if(e.target.id==="graph"||gDrag!=null)graphPointer(e)}));
let strikeArm=false;
document.addEventListener("keydown",e=>{
  if(e.target.id==="cin"){if(e.key==="Enter"){e.preventDefault();calcEnter()}if(e.key==="Escape"){ui.calc=false;renderLayer()}return}
  if(e.key==="Escape"){if(ui.modal||ui.drawer||ui.calc){ui.modal=null;ui.drawer=null;ui.calc=false;renderLayer()}return}
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;
  if(S.phase!=="exam"&&S.phase!=="review")return;
  if(ui.modal)return;
  const id=curId(),k=e.key.toLowerCase();
  if(e.key==="ArrowRight"){go(S.cur+1);return}
  if(e.key==="ArrowLeft"){go(S.cur-1);return}
  if(k==="f"){S.flags[id]=!S.flags[id];save();renderQ();renderRail();return}
  if(isFrq(id)||showFb(id))return;
  if(k==="x"){strikeArm=true;toast("Eliminate which? Press A–D");return}
  const idx="abcd".indexOf(k)>=0?"abcd".indexOf(k):"1234".indexOf(k);
  if(idx>=0){const orig=S.perm[id][idx];
    if(strikeArm){strikeArm=false;const st=S.struck[id]||[];S.struck[id]=st.includes(orig)?st.filter(x=>x!==orig):[...st,orig];if(S.struck[id].includes(S.ans[id]))delete S.ans[id]}
    else{S.ans[id]=orig;if(S.struck[id])S.struck[id]=S.struck[id].filter(x=>x!==orig)}
    save();renderQ();renderRail();return}
  if(e.key==="Enter"&&S.mode==="practice"&&S.ans[id]!=null){S.checked[id]=true;save();renderQ();renderRail()}
});
let rzT;addEventListener("resize",()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if($("#graph"))drawGraph()},120)});
const mq=matchMedia("(prefers-color-scheme: dark)");(mq.addEventListener?mq.addEventListener("change",()=>{if($("#graph"))drawGraph()}):0);
new MutationObserver(()=>{if($("#graph"))drawGraph()}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

ui.mode=S.mode;
if(S.phase==="exam")S.phase="start";
render();
})();
</script>
